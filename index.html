<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo — Tienda de Zapatillas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #141816;
    --ink: #EAEDE9;
    --accent: #4FC38A;
    --stone: #1E2521;
    --stone-dark: #283029;
    --muted: #8B978F;
    --muted-2: #5C6862;
    --white: #1E2521;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ scroll-behavior:smooth; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width:1120px; margin:0 auto; padding:0 20px; }

  /* ---------- HEADER ---------- */
  header{
    position:sticky; top:0; z-index:50;
    background:var(--bg);
    border-bottom:1px solid var(--stone-dark);
  }
  .header-row{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:16px 0;
  }
  .logo{
    font-family:'Archivo',sans-serif;
    font-weight:800;
    font-size:20px;
    letter-spacing:0.3px;
    text-transform:uppercase;
  }
  .header-actions{ display:flex; align-items:center; gap:14px; }
  .icon-btn{
    width:38px; height:38px;
    display:flex; align-items:center; justify-content:center;
    background:none; border:1px solid var(--stone-dark);
    cursor:pointer; color:var(--ink);
  }
  .icon-btn:hover{ border-color:var(--ink); }
  .search-bar{
    max-width:0; overflow:hidden;
    transition:max-width .25s ease;
  }
  .search-bar.open{ max-width:260px; margin-right:8px; }
  .search-bar input{
    width:100%;
    padding:8px 10px;
    border:1px solid var(--stone-dark);
    background:var(--white);
    font-family:'Inter',sans-serif;
    font-size:13px;
    outline:none;
  }
  .search-bar input:focus{ border-color:var(--ink); }

  /* ---------- CARRUSEL ---------- */
  .carousel{
    position:relative;
    height:220px;
    background:var(--stone);
    overflow:hidden;
    margin-top:20px;
  }
  .slide{
    position:absolute; inset:0;
    display:flex; align-items:flex-end;
    padding:24px;
    opacity:0; transition:opacity .5s ease;
    pointer-events:none;
  }
  .slide.active{ opacity:1; pointer-events:auto; }
  .slide-photo{
    position:absolute; right:24px; top:16px; bottom:16px;
    width:40%;
    display:flex; align-items:center; justify-content:center;
  }
  .slide-photo img{ max-width:100%; max-height:100%; object-fit:contain; }
  .slide-info{ max-width:55%; }
  .slide-tag{
    font-size:11px; text-transform:uppercase; letter-spacing:0.08em;
    color:var(--accent); font-weight:600; margin-bottom:6px;
  }
  .slide-name{
    font-family:'Archivo',sans-serif; font-weight:700;
    font-size:26px; line-height:1.1; margin-bottom:8px;
  }
  .slide-price{ font-size:16px; font-weight:600; }
  .slide-price .old{ color:var(--muted-2); text-decoration:line-through; font-weight:400; margin-right:8px; font-size:14px; }
  .dots{
    position:absolute; bottom:14px; left:24px;
    display:flex; gap:6px; z-index:5;
  }
  .dot{
    width:8px; height:8px; background:var(--muted-2); cursor:pointer; border:none; padding:0;
  }
  .dot.active{ background:var(--ink); }

  /* ---------- MARCAS ---------- */
  .section-label{
    font-size:12px; text-transform:uppercase; letter-spacing:0.08em;
    color:var(--muted); font-weight:600;
    margin:36px 0 14px;
  }
  .brands-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(140px,1fr));
    gap:12px;
  }
  .brand-card{
    height:104px;
    background:var(--stone);
    border:1px solid var(--stone-dark);
    border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    position:relative;
    overflow:hidden;
    transition:transform .2s ease, border-color .2s ease;
  }
  .brand-card:hover{ border-color:var(--ink); transform:scale(1.03); }
  .brand-card::before{
    content:"";
    position:absolute;
    inset:6%;
    background:
      radial-gradient(circle at 38% 42%, rgba(242,241,236,0.9) 0%, transparent 65%),
      radial-gradient(circle at 65% 60%, rgba(79,195,138,0.4) 0%, transparent 60%),
      radial-gradient(circle at 55% 30%, rgba(255,255,255,0.5) 0%, transparent 55%);
    filter:blur(14px);
    z-index:0;
  }
  .brand-card img{
    position:relative; z-index:1;
    max-width:82%; max-height:72%; object-fit:contain;
  }
  .brand-card span{
    font-family:'Archivo',sans-serif; font-weight:700; font-size:14px;
    text-transform:uppercase;
  }

  /* ---------- SECCIONES POR MARCA ---------- */
  .brand-section{ margin-top:44px; scroll-margin-top:90px; }
  .brand-section-head{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:16px; padding-bottom:10px;
    border-bottom:2px solid var(--ink);
  }
  .brand-section-head h2{
    font-family:'Archivo',sans-serif; font-weight:800; font-size:20px;
    text-transform:uppercase; letter-spacing:0.3px;
  }
  .brand-count{ font-size:12px; color:var(--muted); }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(160px,1fr));
    gap:16px;
  }
  .card{
    background:var(--white);
    border:1px solid var(--stone-dark);
    border-radius:10px;
    overflow:hidden;
    display:flex; flex-direction:column;
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .card:hover{
    transform:scale(1.03);
    box-shadow:0 8px 20px rgba(0,0,0,0.35);
  }
  .card-media{
    aspect-ratio:1/1;
    position:relative;
    background:var(--stone);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
  }
  .card-media img, .card-media svg{
    max-width:80%; max-height:80%;
    width:auto; height:auto;
    object-fit:contain;
    object-position:center;
  }
  .discount-badge{
    position:absolute; top:8px; right:8px;
    background:var(--accent); color:var(--white);
    font-size:11px; font-weight:600;
    padding:3px 6px;
    border-radius:6px;
  }
  .tag-badge{
    position:absolute; top:8px; left:8px;
    background:var(--ink); color:var(--white);
    font-size:10px; text-transform:uppercase; letter-spacing:0.05em;
    padding:3px 6px;
    border-radius:6px;
  }
  .card-body{ padding:12px 14px 14px; display:flex; flex-direction:column; gap:6px; flex:1; }
  .card-name{ font-size:13px; font-weight:600; line-height:1.3; }
  .card-sizes{ font-size:11px; color:var(--muted); }
  .card-price{ margin-top:auto; display:flex; align-items:baseline; gap:6px; }
  .price-now{ font-family:'Archivo',sans-serif; font-weight:700; font-size:16px; }
  .price-old{ font-size:12px; color:var(--muted-2); text-decoration:line-through; }
  .card-cta{
    margin-top:8px;
    display:block; text-align:center;
    background:var(--ink); color:var(--white);
    font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:0.04em;
    padding:9px; text-decoration:none;
    border-radius:6px;
    transition:background .2s ease;
  }
  .card-cta:hover{ background:var(--accent); }

  .empty-msg{ color:var(--muted); font-size:14px; padding:20px 0; }

  /* ---------- WHATSAPP FLOTANTE ---------- */
  .btn-mostrar-mas{
    display:block;
    margin:18px auto 0;
    padding:10px 22px;
    background:none;
    border:1px solid var(--stone-dark);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-size:13px; font-weight:600;
    text-transform:uppercase; letter-spacing:0.04em;
    border-radius:6px;
    cursor:pointer;
    transition:background .2s ease, border-color .2s ease;
  }
  .btn-mostrar-mas:hover{ background:var(--stone); border-color:var(--accent); }

  .back-to-top{
    position:fixed; bottom:22px; right:84px; z-index:60;
    width:52px; height:52px;
    border-radius:50%;
    background:var(--stone);
    border:1px solid var(--stone-dark);
    color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    font-size:20px;
    opacity:0; pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
  }
  .back-to-top.visible{ opacity:1; pointer-events:auto; }
  .back-to-top:hover{ transform:scale(1.08); border-color:var(--accent); }

  .wa-float{
    position:fixed; bottom:22px; right:22px; z-index:60;
    width:52px; height:52px;
    border-radius:50%;
    background:var(--accent); color:var(--bg);
    display:flex; align-items:center; justify-content:center;
    text-decoration:none; font-size:22px;
    transition:transform .2s ease, background .2s ease;
  }
  .wa-float:hover{ background:#3AA873; transform:scale(1.08); }

  footer{
    margin-top:60px; padding:36px 0 40px;
    border-top:20px solid var(--bg);
    font-size:12px; color:var(--muted);
  }
  .contact-box{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(160px,1fr));
    gap:20px;
    background:var(--stone);
    border:1px solid var(--stone-dark);
    border-radius:10px;
    padding:22px 24px;
    margin-bottom:20px;
  }
  .contact-col h4{
    font-family:'Archivo',sans-serif;
    font-size:12px; text-transform:uppercase; letter-spacing:0.06em;
    color:var(--ink); margin-bottom:8px;
  }
  .contact-col p{ margin-bottom:4px; line-height:1.5; }
  .footer-bottom{
    display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px;
  }

  @media (max-width:640px){
    .slide-info{ max-width:60%; }
    .slide-name{ font-size:20px; }
    .slide-photo{ width:38%; }
    .carousel{ height:190px; }
  }
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>
/* =========================================================
   CONEXIÓN A GOOGLE SHEETS
   Pegá acá tus dos links publicados como CSV:
   1. SHEET_PRODUCTOS: pestaña con nombre, marca, precio, precio_anterior, talla, tag, foto_url
   2. SHEET_MARCAS: pestaña con marca, logo_url
========================================================= */
const SHEET_PRODUCTOS = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTXNG_wi5fYQ613ZRceRZh8sH20MnK2gyqCuBZG5_Z2jivNFeOcz0SYFLe9bk69oLI33vWNMxhwyJ9s/pub?gid=0&single=true&output=csv";
const SHEET_MARCAS = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTXNG_wi5fYQ613ZRceRZh8sH20MnK2gyqCuBZG5_Z2jivNFeOcz0SYFLe9bk69oLI33vWNMxhwyJ9s/pub?gid=1486876337&single=true&output=csv";

const numeroWhatsapp = "51929862374";

const productosDeEjemplo = [
  { name:"Runner Classic", brand:"NIKE", price:45000, oldPrice:52000, sizes:["40","41","42"], tag:"nuevo", foto:null },
  { name:"Street Low", brand:"ADIDAS", price:38000, oldPrice:null, sizes:["35","36","37"], tag:"oferta", foto:null },
  { name:"Kids Sprint", brand:"PUMA", price:29000, oldPrice:null, sizes:["28","29","30"], tag:null, foto:null },
];
const marcasDeEjemplo = [
  { marca:"NIKE", logo:null },
  { marca:"ADIDAS", logo:null },
  { marca:"PUMA", logo:null },
];

let products = [];
let brands = [];

function fetchCSV(url){
  return fetch(url).then(res => res.text()).then(text => {
    const r = Papa.parse(text, { header:true, skipEmptyLines:true });
    return r.data.map(fila => {
      const f = {};
      Object.keys(fila).forEach(k => f[k.trim().toLowerCase()] = fila[k]);
      return f;
    });
  });
}

function cargarDatos(callback){
  const p1 = SHEET_PRODUCTOS ? fetchCSV(SHEET_PRODUCTOS) : Promise.resolve(null);
  const p2 = SHEET_MARCAS ? fetchCSV(SHEET_MARCAS) : Promise.resolve(null);

  Promise.all([p1, p2]).then(([filasProd, filasMarcas]) => {
    products = filasProd ? filasProd.filter(f => f.nombre).map(f => ({
      name: f.nombre,
      brand: (f.marca || "SIN MARCA").trim(),
      price: Number(f.precio) || 0,
      oldPrice: f.precio_anterior ? Number(f.precio_anterior) : null,
      sizes: (f.talla || f.talles || "").split(",").map(s=>s.trim()).filter(Boolean),
      tag: f.tag ? f.tag.trim().toLowerCase() : null,
      foto: f.foto_url || null
    })) : productosDeEjemplo;

    brands = filasMarcas ? filasMarcas.filter(f => f.marca).map(f => ({
      marca: f.marca.trim(),
      logo: f.logo_url || null
    })) : (SHEET_MARCAS ? [] : marcasDeEjemplo);

    if(brands.length === 0){
      const nombres = [...new Set(products.map(p=>p.brand))];
      brands = nombres.map(n => ({ marca:n, logo:null }));
    }
    callback();
  }).catch(err => {
    console.error("Error cargando Google Sheets:", err);
    products = productosDeEjemplo;
    brands = marcasDeEjemplo;
    callback();
  });
}

function money(n){ return "S/ " + n.toLocaleString("es-PE"); }

function sneakerSVG(){
  return `<svg viewBox="0 0 100 60" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M5 45 C5 35, 15 32, 22 30 L45 18 C50 15, 58 14, 63 17 L80 27 C88 30, 95 33, 95 42 L95 48 C95 51, 92 53, 89 53 L10 53 C7 53, 5 51, 5 48 Z" fill="#3E4842"/>
  </svg>`;
}

function renderCarousel(){
  const destacados = products.slice(0,5);
  const el = document.getElementById("carousel");
  if(destacados.length === 0){ el.innerHTML = ""; return; }
  el.innerHTML = destacados.map((p,i) => `
    <div class="slide ${i===0 ? 'active':''}" data-i="${i}">
      <div class="slide-info">
        <div class="slide-tag">${p.tag ? p.tag : 'destacado'}</div>
        <div class="slide-name">${p.name}</div>
        <div class="slide-price">
          ${p.oldPrice ? `<span class="old">${money(p.oldPrice)}</span>` : ""}
          ${money(p.price)}
        </div>
      </div>
      <div class="slide-photo">${p.foto ? `<img src="${p.foto}">` : sneakerSVG()}</div>
    </div>
  `).join("") + `<div class="dots">${destacados.map((_,i)=>`<button class="dot ${i===0?'active':''}" data-i="${i}"></button>`).join("")}</div>`;

  let actual = 0;
  const slides = el.querySelectorAll(".slide");
  const dots = el.querySelectorAll(".dot");
  function ir(i){
    slides.forEach(s=>s.classList.remove("active"));
    dots.forEach(d=>d.classList.remove("active"));
    slides[i].classList.add("active");
    dots[i].classList.add("active");
    actual = i;
  }
  dots.forEach(d => d.addEventListener("click", ()=> ir(Number(d.dataset.i))));
  setInterval(()=> ir((actual+1) % slides.length), 4500);
  procesarImagenesAutoCrop();
}

function renderBrandsGrid(){
  const el = document.getElementById("brandsGrid");
  const marcasConProductos = new Set(products.map(p => p.brand));
  const brandsConStock = brands.filter(b => marcasConProductos.has(b.marca));

  el.innerHTML = brandsConStock.map(b => `
    <div class="brand-card" data-brand="${b.marca}">
      ${b.logo ? `<img src="${b.logo}">` : `<span>${b.marca}</span>`}
    </div>
  `).join("");
  el.querySelectorAll(".brand-card").forEach(card => {
    card.addEventListener("click", () => {
      const target = document.getElementById("brand-" + card.dataset.brand.replace(/\s+/g,"-"));
      if(target) target.scrollIntoView({behavior:"smooth"});
    });
  });
}

function productCard(p){
  const descuento = p.oldPrice ? Math.round((1 - p.price/p.oldPrice)*100) : null;
  return `
    <div class="card">
      <div class="card-media">
        ${descuento ? `<div class="discount-badge">-${descuento}%</div>` : ""}
        ${p.tag && !descuento ? `<div class="tag-badge">${p.tag}</div>` : ""}
        ${p.foto ? `<img src="${p.foto}">` : sneakerSVG()}
      </div>
      <div class="card-body">
        <div class="card-name">${p.name}</div>
        ${p.sizes.length ? `<div class="card-sizes">Talla ${p.sizes.join(", ")}</div>` : ""}
        <div class="card-price">
          <span class="price-now">${money(p.price)}</span>
          ${p.oldPrice ? `<span class="price-old">${money(p.oldPrice)}</span>` : ""}
        </div>
        <a class="card-cta" target="_blank" href="https://wa.me/${numeroWhatsapp}?text=${encodeURIComponent('Hola, estoy interesado en el producto: ' + p.name + '. ¿Me podrías dar más información?')}">Consultar</a>
      </div>
    </div>
  `;
}

const PRODUCTOS_INICIALES_POR_MARCA = 8;

function renderBrandSections(filtro){
  const el = document.getElementById("brandSections");
  const term = (filtro || "").trim().toLowerCase();
  const porMarca = {};
  products.forEach(p => {
    if(term && !p.name.toLowerCase().includes(term)) return;
    if(!porMarca[p.brand]) porMarca[p.brand] = [];
    porMarca[p.brand].push(p);
  });
  const marcasAMostrar = brands.map(b=>b.marca).filter(m => porMarca[m] && porMarca[m].length);

  if(marcasAMostrar.length === 0){
    el.innerHTML = `<p class="empty-msg">No se encontraron productos.</p>`;
    return;
  }

  el.innerHTML = marcasAMostrar.map(marca => {
    const productosMarca = porMarca[marca];
    const hayMas = productosMarca.length > PRODUCTOS_INICIALES_POR_MARCA;
    const visibles = productosMarca.slice(0, PRODUCTOS_INICIALES_POR_MARCA);
    const idSeccion = "brand-" + marca.replace(/\s+/g,"-");
    return `
    <div class="brand-section" id="${idSeccion}" data-marca="${marca}">
      <div class="brand-section-head">
        <h2>${marca}</h2>
        <span class="brand-count">${productosMarca.length} producto(s)</span>
      </div>
      <div class="grid" id="grid-${idSeccion}">
        ${visibles.map(productCard).join("")}
      </div>
      ${hayMas ? `<button class="btn-mostrar-mas" data-marca="${marca}">Mostrar más productos</button>` : ""}
    </div>
  `;
  }).join("");

  procesarImagenesAutoCrop();

  el.querySelectorAll(".btn-mostrar-mas").forEach(btn => {
    btn.addEventListener("click", () => {
      const marca = btn.dataset.marca;
      const idSeccion = "brand-" + marca.replace(/\s+/g,"-");
      const grid = document.getElementById("grid-" + idSeccion);
      const restantes = porMarca[marca].slice(grid.children.length);
      grid.insertAdjacentHTML("beforeend", restantes.map(productCard).join(""));
      procesarImagenesAutoCrop();
      btn.remove();
    });
  });
}

/* =========================================================
   RECORTE AUTOMÁTICO DE ESPACIO EN BLANCO ALREDEDOR DEL PRODUCTO
   - Escanea los 4 bordes de la imagen buscando dónde termina
     el fondo (comparado con el color de la esquina) y empieza el producto.
   - Recorta a ese recuadro, para que el producto ocupe más espacio
     y se vea consistente entre fotos distintas.
   - Si la imagen no tiene permiso de acceso a píxeles (típico en
     algunos links de Google Drive), simplemente no se recorta
     y se deja la foto tal cual, sin romper nada.
========================================================= */
function autoCropImage(src, callback){
  const img = new Image();
  img.crossOrigin = "anonymous";
  img.onload = function(){
    try{
      const w = img.naturalWidth, h = img.naturalHeight;
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0);
      const data = ctx.getImageData(0, 0, w, h).data;

      const bgR = data[0], bgG = data[1], bgB = data[2];
      const umbral = 18;
      function esFondo(i){
        return Math.abs(data[i]-bgR) < umbral && Math.abs(data[i+1]-bgG) < umbral && Math.abs(data[i+2]-bgB) < umbral;
      }

      let top=0, bottom=h-1, left=0, right=w-1;

      busqTop:
      for(let y=0; y<h; y++){
        for(let x=0; x<w; x+=2){
          if(!esFondo((y*w+x)*4)){ top=y; break busqTop; }
        }
      }
      busqBottom:
      for(let y=h-1; y>=0; y--){
        for(let x=0; x<w; x+=2){
          if(!esFondo((y*w+x)*4)){ bottom=y; break busqBottom; }
        }
      }
      busqLeft:
      for(let x=0; x<w; x++){
        for(let y=0; y<h; y+=2){
          if(!esFondo((y*w+x)*4)){ left=x; break busqLeft; }
        }
      }
      busqRight:
      for(let x=w-1; x>=0; x--){
        for(let y=0; y<h; y+=2){
          if(!esFondo((y*w+x)*4)){ right=x; break busqRight; }
        }
      }

      const pad = Math.round(Math.min(w,h) * 0.04);
      left = Math.max(0, left-pad);
      top = Math.max(0, top-pad);
      right = Math.min(w-1, right+pad);
      bottom = Math.min(h-1, bottom+pad);

      const cw = right-left, ch = bottom-top;
      if(cw <= 10 || ch <= 10){ callback(null); return; }

      const outCanvas = document.createElement("canvas");
      outCanvas.width = cw; outCanvas.height = ch;
      outCanvas.getContext("2d").drawImage(canvas, left, top, cw, ch, 0, 0, cw, ch);
      callback(outCanvas.toDataURL());
    }catch(e){
      callback(null); // imagen bloqueada por CORS u otro error: se deja tal cual
    }
  };
  img.onerror = function(){ callback(null); };
  img.src = src;
}

function procesarImagenesAutoCrop(){
  document.querySelectorAll(".card-media img, .slide-photo img").forEach(imgEl => {
    if(imgEl.dataset.autocropped) return;
    imgEl.dataset.autocropped = "1";
    const original = imgEl.src;
    autoCropImage(original, (recortada) => {
      if(recortada) imgEl.src = recortada;
    });
  });
}
